name: Deploy Infrastructure (CloudFormation)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

jobs:
  deploy-infra:
    name: Package & Deploy CloudFormation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Auto-Create CloudFormation Template S3 Bucket if Missing
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${{ vars.CF_TEMPLATE_BUCKET }}"
          if [ -z "$BUCKET_NAME" ]; then
            BUCKET_NAME="cf-templates-${ACCOUNT_ID}-${REGION}"
          fi
          echo "CF_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Creating CloudFormation template S3 bucket: $BUCKET_NAME"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
          else
            echo "Template S3 bucket $BUCKET_NAME exists."
          fi

      - name: Package & Deploy CloudFormation Stacks
        run: |
          aws cloudformation package \
            --template-file infra/master.yaml \
            --s3-bucket ${{ env.CF_BUCKET }} \
            --output-template-file infra/packaged-master.yaml

          aws cloudformation deploy \
            --template-file infra/packaged-master.yaml \
            --stack-name doc-search-production-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides Environment=production KeyName="${{ vars.KEY_NAME || '' }}"
