name: Deploy Infrastructure (CloudFormation)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package & Deploy CloudFormation Stacks
        run: |
          aws cloudformation package \
            --template-file infra/master.yaml \
            --s3-bucket ${{ secrets.CF_TEMPLATE_BUCKET }} \
            --output-template-file infra/packaged-master.yaml

          aws cloudformation deploy \
            --template-file infra/packaged-master.yaml \
            --stack-name doc-search-production-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides Environment=production
