AWSTemplateFormatVersion: "2010-09-09"
Description: "Storage Stack - Document S3 Bucket (1-day Tmp Lifecycle), React Web Hosting S3 Bucket, SQS Queue & DLQ"

Parameters:
  Environment:
    Type: String
    Default: production

Resources:
  # Dead Letter Queue for failed indexing attempts
  DocDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "doc-dlq-${Environment}"
      MessageRetentionPeriod: 1209600 # 14 days

  # Main Processing Queue
  DocQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "doc-processing-queue-${Environment}"
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocDLQ.Arn
        maxReceiveCount: 3

  # Queue Policy allowing Document S3 Bucket to publish event notifications
  DocQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: "sqs:SendMessage"
            Resource: !GetAtt DocQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::doc-search-storage-${Environment}-${AWS::AccountId}"

  # S3 Bucket for Document Storage (Uploads & Processing)
  DocumentBucket:
    Type: AWS::S3::Bucket
    DependsOn: DocQueuePolicy
    Properties:
      BucketName: !Sub "doc-search-storage-${Environment}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTmpFilesAfter1Day
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt DocQueue.Arn

  # S3 Bucket for React Frontend Static Web Hosting
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "react-web-hosting-${Environment}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${WebBucket.Arn}/*"

Outputs:
  DocumentBucketName:
    Value: !Ref DocumentBucket
    Export:
      Name: !Sub "${AWS::StackName}-DocumentBucketName"
  DocumentBucketArn:
    Value: !GetAtt DocumentBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentBucketArn"
  WebBucketName:
    Value: !Ref WebBucket
    Export:
      Name: !Sub "${AWS::StackName}-WebBucketName"
  WebBucketWebsiteURL:
    Value: !GetAtt WebBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebBucketWebsiteURL"
  DocQueueUrl:
    Value: !Ref DocQueue
    Export:
      Name: !Sub "${AWS::StackName}-DocQueueUrl"
  DocQueueArn:
    Value: !GetAtt DocQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocQueueArn"
  DocDLQArn:
    Value: !GetAtt DocDLQ.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocDLQArn"
