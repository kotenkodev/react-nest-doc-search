AWSTemplateFormatVersion: "2010-09-09"
Description: "Compute Stack - EC2 Instance with IAM Role for S3, SQS & OpenSearch"

Parameters:
  Environment:
    Type: String
    Default: production
  QueueArn:
    Type: String
  BucketArn:
    Type: String
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Description: Optional EC2 KeyPair name for SSH access
    Default: ""
  AmiId:
    Type: String
    Description: Optional explicit AMI ID override
    Default: ""

Mappings:
  RegionToAmi:
    us-east-1:
      AmiId: "ami-0db1c5c6dc64eb019"
    us-east-2:
      AmiId: "ami-0b4624d29a0750ede"
    us-west-1:
      AmiId: "ami-006bd1cead10a7657"
    us-west-2:
      AmiId: "ami-00448a081839b6149"
    eu-central-1:
      AmiId: "ami-09024b009ae9e7adc"
    eu-west-1:
      AmiId: "ami-0e12a41a4a589cf8b"

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasAmiId: !Not [!Equals [!Ref AmiId, ""]]

Resources:
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "doc-search-ec2-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3AndSQSAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Ref QueueArn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref BucketArn
                  - !Sub "${BucketArn}/*"
              - Effect: Allow
                Action:
                  - "es:*"
                Resource: "*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP/S and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !If [HasAmiId, !Ref AmiId, !FindInMap [RegionToAmi, !Ref "AWS::Region", AmiId]]
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker git
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true

Outputs:
  InstancePublicIp:
    Value: !GetAtt EC2Instance.PublicIp
