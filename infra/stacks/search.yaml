AWSTemplateFormatVersion: "2010-09-09"
Description: "Search Stack - AWS OpenSearch Domain"

Parameters:
  Environment:
    Type: String
    Default: production
  MasterUserName:
    Type: String
    Default: admin
    Description: Master username for OpenSearch internal database
  MasterUserPassword:
    Type: String
    NoEcho: true
    Default: "Admin12345!"
    Description: Master user password for OpenSearch internal database

Resources:
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "doc-search-${Environment}"
      EngineVersion: "OpenSearch_2.11"
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref MasterUserName
          MasterUserPassword: !Ref MasterUserPassword
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/doc-search-ec2-role-${Environment}"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/doc-search-${Environment}/*"

Outputs:
  DomainEndpoint:
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-DomainEndpoint"
  DomainArn:
    Value: !GetAtt OpenSearchDomain.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DomainArn"
