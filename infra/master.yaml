AWSTemplateFormatVersion: "2010-09-09"
Description: "Master Orchestrator Stack - Deploys Storage, Search, and Compute Stacks"

Parameters:
  Environment:
    Type: String
    Default: production
  KeyName:
    Type: String
    Description: Optional EC2 KeyPair name for SSH access
    Default: ""
  OpenSearchMasterUser:
    Type: String
    Default: admin
    Description: Master username for OpenSearch
  OpenSearchMasterPassword:
    Type: String
    NoEcho: true
    Default: "Admin12345!"
    Description: Master user password for OpenSearch

Resources:
  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/storage.yaml
      Parameters:
        Environment: !Ref Environment

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/compute.yaml
      Parameters:
        Environment: !Ref Environment
        QueueArn: !GetAtt StorageStack.Outputs.DocQueueArn
        BucketArn: !GetAtt StorageStack.Outputs.DocumentBucketArn
        KeyName: !Ref KeyName

  SearchStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/search.yaml
      Parameters:
        Environment: !Ref Environment
        MasterUserName: !Ref OpenSearchMasterUser
        MasterUserPassword: !Ref OpenSearchMasterPassword
        AllowedIp: !Sub "${ComputeStack.Outputs.InstancePublicIp}/32"

Outputs:
  DocumentBucketName:
    Value: !GetAtt StorageStack.Outputs.DocumentBucketName
  DocQueueUrl:
    Value: !GetAtt StorageStack.Outputs.DocQueueUrl
  OpenSearchEndpoint:
    Value: !GetAtt SearchStack.Outputs.DomainEndpoint
  EC2PublicIp:
    Value: !GetAtt ComputeStack.Outputs.InstancePublicIp
